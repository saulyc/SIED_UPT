<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SIED-UPTE | Sistema de Educación Dual</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f3f5f8;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 90%;
            max-width: 650px;
            padding: 45px;
            background: white;
            border-radius: 14px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .logo {
            color: #153e65;
            font-size: 38px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        h1 {
            color: #263746;
            margin-bottom: 15px;
        }

        p {
            color: #64748b;
            line-height: 1.6;
        }

        .status {
            display: inline-block;
            margin-top: 25px;
            padding: 10px 18px;
            border-radius: 20px;
            background: #dcfce7;
            color: #166534;
            font-size: 14px;
            font-weight: bold;
        }

        footer {
            margin-top: 30px;
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="logo">SIED-UPTE</div>

        <h1>Sistema de Educación Dual</h1>

        <p>
            Plataforma institucional para la gestión y seguimiento
            de oportunidades, estudiantes, empresas y procesos
            de Educación Dual.
        </p>

        <div class="status">
            Aplicación iniciada correctamente
        </div>

        <footer>
            Universidad Politécnica de Tecámac
        </footer>

    </main>

</body>
</html>
